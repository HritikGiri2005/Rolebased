{% extends 'base.html' %}

{% block title %}
Login
{% endblock %}


{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body">

                    <h3 class="text-center mb-4">
                        Login
                    </h3>


                    <form method="POST">

                        {% csrf_token %}

                        {{ form.non_field_errors }}


                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            {{ form.username }}

                            {{ form.username.errors }}

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            {{ form.password }}

                            {{ form.password.errors }}

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Login
                        </button>

                    </form>


                    <div class="text-center mt-3">

                        Don't have an account?

                        <a href="{% url 'register' %}">
                            Register
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
